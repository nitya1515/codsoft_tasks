kind = "web"
previewPath = "/"
title = "Northstar Goods"
description = "A polished full-stack storefront for browsing curated products, filtering the catalog, managing a cart, signing in, and completing checkout."
version = "1.0.0"
id = "artifacts/ecommerce-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20556

[services.development]
run = "pnpm --filter @workspace/ecommerce-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecommerce-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecommerce-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20556"
BASE_PATH = "/"
