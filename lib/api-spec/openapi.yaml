openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product discovery
  - name: cart
    description: Shopping cart operations
  - name: account
    description: Customer account operations
  - name: checkout
    description: Checkout operations
  - name: project-management
    description: Project and task management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [featured, newest, price-asc, price-desc]
            default: featured
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current user's cart
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          description: Authentication required
    put:
      operationId: updateCart
      tags: [cart]
      summary: Replace the current user's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          description: Authentication required
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the signed-in customer profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
  /checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionInput"
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "401":
          description: Authentication required
        "503":
          description: Payment provider not connected
  /projects:
    get:
      operationId: listProjects
      tags: [project-management]
      summary: List projects
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, planning, completed, archived]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [project-management]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [project-management]
      summary: Get a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [project-management]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [project-management]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
  /tasks:
    get:
      operationId: listTasks
      tags: [project-management]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [backlog, todo, in_progress, review, done]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [project-management]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Project or assignee not found
  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [project-management]
      summary: Get a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    patch:
      operationId: updateTask
      tags: [project-management]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [project-management]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /members:
    get:
      operationId: listMembers
      tags: [project-management]
      summary: List available assignees
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [project-management]
      summary: Get dashboard summary
      responses:
        "200":
          description: Project and task summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [project-management]
      summary: List recent project activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, description, price, category, imageUrl, badge, inventory, featured]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        compareAtPrice:
          type: ["number", "null"]
        category:
          type: string
        imageUrl:
          type: string
        badge:
          type: ["string", "null"]
        inventory:
          type: integer
        featured:
          type: boolean
    Category:
      type: object
      required: [id, name, count]
      properties:
        id:
          type: string
        name:
          type: string
        count:
          type: integer
    CartItem:
      type: object
      required: [productId, quantity, product]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        product:
          $ref: "#/components/schemas/Product"
    Cart:
      type: object
      required: [items, subtotal, itemCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        itemCount:
          type: integer
    CartInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemInput"
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    UserProfile:
      type: object
      required: [id, email, firstName, lastName]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
    CheckoutSessionInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemInput"
        successUrl:
          type: ["string", "null"]
        cancelUrl:
          type: ["string", "null"]
    CheckoutSession:
      type: object
      required: [status, checkoutUrl]
      properties:
        status:
          type: string
          enum: [ready, provider_required]
        checkoutUrl:
          type: ["string", "null"]
    Project:
      type: object
      required: [id, name, description, status, priority, startDate, dueDate, progress, taskCount, completedTaskCount, memberIds, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, planning, completed, archived]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: string
        dueDate:
          type: ["string", "null"]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        memberIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [name, description, status, priority, startDate]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [active, planning, completed, archived]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: string
        dueDate:
          type: ["string", "null"]
        memberIds:
          type: array
          items:
            type: string
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [active, planning, completed, archived]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: string
        dueDate:
          type: ["string", "null"]
        memberIds:
          type: array
          items:
            type: string
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, assigneeId, assignee, deadline, progress, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assigneeId:
          type: ["string", "null"]
        assignee:
          allOf:
            - $ref: "#/components/schemas/Member"
          nullable: true
        deadline:
          type: ["string", "null"]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      required: [projectId, title, description, status, priority]
      properties:
        projectId:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assigneeId:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        progress:
          type: integer
          minimum: 0
          maximum: 100
    TaskUpdate:
      type: object
      properties:
        projectId:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assigneeId:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        progress:
          type: integer
          minimum: 0
          maximum: 100
    Member:
      type: object
      required: [id, name, email, initials, color]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        initials:
          type: string
        color:
          type: string
    DashboardSummary:
      type: object
      required: [projectCount, activeProjectCount, taskCount, completedTaskCount, overdueTaskCount, dueThisWeekCount, progress, statusBreakdown]
      properties:
        projectCount:
          type: integer
        activeProjectCount:
          type: integer
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        overdueTaskCount:
          type: integer
        dueThisWeekCount:
          type: integer
        progress:
          type: integer
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
    Activity:
      type: object
      required: [id, kind, message, projectId, projectName, taskId, taskTitle, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [project_created, project_updated, task_created, task_updated, task_completed]
        message:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        taskId:
          type: ["string", "null"]
        taskTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

